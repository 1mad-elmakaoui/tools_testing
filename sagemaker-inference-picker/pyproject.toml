[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sagemaker-inference-picker"
version = "0.1.0"
description = "Recommend the right Amazon SageMaker inference option for a workload, and explain why every other option was ruled out."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Imad" }]
keywords = ["aws", "sagemaker", "inference", "mlops", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/imadelmakaoui-UJ/tools-aws"
Repository = "https://github.com/imadelmakaoui-UJ/tools-aws"
Issues = "https://github.com/imadelmakaoui-UJ/tools-aws/issues"
Changelog = "https://github.com/imadelmakaoui-UJ/tools-aws/blob/main/CHANGELOG.md"

[project.scripts]
sagemaker-inference-picker = "sagemaker_inference_picker.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.11",
  "ruff>=0.6",
  "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sagemaker_inference_picker"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "RUF", "ANN", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["sagemaker_inference_picker", "scripts", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN401"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=sagemaker_inference_picker --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["sagemaker_inference_picker"]
