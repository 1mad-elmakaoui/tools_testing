[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kinesis-skew"
version = "0.1.0"
description = "Tell partition key skew apart from genuine under-provisioning in Kinesis Data Streams."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Imad" }]
keywords = ["aws", "kinesis", "shards", "throttling", "cloudwatch", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]
# This tool has to call AWS to do its job, so boto3 is a core dependency. Every operation
# it can make is a read, and the allowlist is enforced at runtime by aws.py. The two
# sampling operations are only added to that allowlist when --sample-keys is passed.
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "PyYAML>=6.0",
  "boto3>=1.34",
]

[project.urls]
Homepage = "https://github.com/imadelmakaoui-UJ/tools-aws/tree/main/kinesis-skew"
Repository = "https://github.com/imadelmakaoui-UJ/tools-aws"
Issues = "https://github.com/imadelmakaoui-UJ/tools-aws/issues"

[project.scripts]
kinesis-skew = "kinesis_skew.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.11",
  "ruff>=0.6",
  "types-PyYAML>=6.0",
  "boto3-stubs[cloudwatch,kinesis]>=1.34",
  "botocore>=1.34",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kinesis_skew"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "RUF", "ANN", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["kinesis_skew", "scripts", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN401", "ARG001", "ARG002", "ARG005"]
# The demo's stand-in clients mirror botocore's **kwargs signatures, which are Any by nature.
"scripts/make_demo.py" = ["ANN401"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=kinesis_skew --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["kinesis_skew"]
