[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bedrock-log-lens"
version = "0.1.0"
description = "Analyse Amazon Bedrock model invocation logs for token usage, cost and anomalies, without ever reading the prompts."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Imad" }]
keywords = ["aws", "bedrock", "llm", "logs", "cost", "finops", "privacy", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]
# Analysing a local directory of logs needs no AWS at all, so boto3 is an optional extra
# imported inside s3.py. A test asserts importing the package does not pull it in.
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]

[project.urls]
Homepage = "https://github.com/imadelmakaoui-UJ/tools-aws/tree/main/bedrock-log-lens"
Repository = "https://github.com/imadelmakaoui-UJ/tools-aws"
Issues = "https://github.com/imadelmakaoui-UJ/tools-aws/issues"

[project.scripts]
bedrock-log-lens = "bedrock_log_lens.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.11",
  "ruff>=0.6",
  "types-PyYAML>=6.0",
  "boto3>=1.34",
  "boto3-stubs[s3]>=1.34",
  "botocore>=1.34",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bedrock_log_lens"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "RUF", "ANN", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["bedrock_log_lens", "scripts", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN401", "ARG001", "ARG002", "ARG005"]
"scripts/make_demo.py" = ["ANN401"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=bedrock_log_lens --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["bedrock_log_lens"]
