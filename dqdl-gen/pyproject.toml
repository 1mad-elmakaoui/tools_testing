[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dqdl-gen"
version = "0.1.0"
description = "Profile a CSV or Parquet file and generate a starter AWS Glue Data Quality ruleset in DQDL."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Imad" }]
keywords = ["aws", "glue", "data-quality", "dqdl", "profiling", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "PyYAML>=6.0",
  "pyarrow>=16.0",
]

# boto3 is deliberately NOT a core dependency. Only `dqdl-gen push` writes to AWS, and
# only push.py imports boto3; tests/test_no_aws_calls.py fails the build if that changes.
[project.optional-dependencies]
push = ["boto3>=1.34"]

[project.urls]
Homepage = "https://github.com/imadelmakaoui-UJ/tools-aws/tree/main/dqdl-gen"
Repository = "https://github.com/imadelmakaoui-UJ/tools-aws"
Issues = "https://github.com/imadelmakaoui-UJ/tools-aws/issues"

[project.scripts]
dqdl-gen = "dqdl_gen.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.11",
  "ruff>=0.6",
  "types-PyYAML>=6.0",
  "boto3>=1.34",
  "boto3-stubs[glue]>=1.34",
  "botocore>=1.34",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dqdl_gen"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "RUF", "ANN", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["dqdl_gen", "tests"]

[tool.ruff.lint.per-file-ignores]
# Test doubles must match the signature they stand in for, unused arguments and all.
"tests/*" = ["ANN401", "ARG001", "ARG005"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=dqdl_gen --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["dqdl_gen"]
